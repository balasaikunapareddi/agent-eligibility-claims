[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eligibility-claims"
version = "0.1.0"
description = "Strands + LiteLLM agent that verifies healthcare eligibility, tracks claims, and estimates patient cost — deterministic tools, mock payer data, no paid key for tests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bala Sai Kunapareddi" }]
dependencies = [
    "strands-agents>=1.0",
    "litellm>=1.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eligibility-claims-demo = "agent_eligibility_claims.demo:main"
eligibility-claims-server = "agent_eligibility_claims.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_eligibility_claims = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
